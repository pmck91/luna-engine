[package]
name = "luna-runner"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bench]]
name = "undo"
harness = false

[[bin]]
name = "luna"
path = "src/main.rs"

[[bench]]
name = "scaling"
harness = false

[[bench]]
name = "parser_context"
harness = false

[dependencies]
luna-model = { path = "../luna-model" }
luna-core = { path = "../luna-core" }
luna-project = { path = "../luna-project" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
directories.workspace = true
chrono.workspace = true
uuid.workspace = true
toml = "0.8"
tempfile.workspace = true
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }
rustyline = { version = "19", default-features = false }
fs2.workspace = true

[dev-dependencies]
tempfile.workspace = true
portable-pty = "0.9"

[[bench]]
name = "procedures"
harness = false

[[bench]]
name = "turns"
harness = false

[[bench]]
name = "routines"
harness = false
