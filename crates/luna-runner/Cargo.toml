[package]
name = "luna-runner"
version.workspace = true
edition.workspace = true

[features]
undo-proof = ["luna-core/undo-proof"]

[[test]]
name = "undo_proof"
required-features = ["undo-proof"]

[[bench]]
name = "undo_proof"
harness = false
required-features = ["undo-proof"]

[[bin]]
name = "luna"
path = "src/main.rs"

[[bench]]
name = "scaling"
harness = false

[[bench]]
name = "parser_context"
harness = false

[dependencies]
luna-model = { path = "../luna-model" }
luna-core = { path = "../luna-core" }
luna-project = { path = "../luna-project" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
directories.workspace = true
chrono.workspace = true
uuid.workspace = true
toml = "0.8"
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bench]]
name = "procedures"
harness = false

[[bench]]
name = "turns"
harness = false

[[bench]]
name = "routines"
harness = false
