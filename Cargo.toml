[workspace]
members = ["crates/luna-model", "crates/luna-core", "crates/luna-project", "crates/luna-editor", "crates/luna-runner"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Serde's unknown-field rejection does not change the generated TypeScript shape.
ts-rs = { version = "10", features = ["serde-json-impl", "no-serde-warnings"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
