name: Runner terminal controls

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner:
    name: Runner on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-2022]
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked -p luna-runner --all-targets -- -D warnings
      - name: Test runner, real terminal keys and script compatibility
        timeout-minutes: 15
        run: cargo test --locked -p luna-runner
